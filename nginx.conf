server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 构建产物中的静态资源带长缓存（不可变，文件名含哈希）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 本应用为纯单页、无前端路由，无需 SPA fallback（try_files 到 index.html）
    # 若将来引入 createWebHistory 路由，改为：try_files $uri $uri/ /index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

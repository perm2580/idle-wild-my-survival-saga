name: 自动化创建Docker镜像

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检查代码
        uses: actions/checkout@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建Docker镜像
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/idle-wild-my-survival-saga:latest .

      - name: 推送到 Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/idle-wild-my-survival-saga:latest
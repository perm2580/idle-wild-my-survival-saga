name: 自动化创建Docker镜像

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检查代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建 Docker 镜像（双 tag：latest + 版本号）
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/iwms:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/iwms:${{ steps.version.outputs.tag }} \
            .

      - name: 推送到 Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/iwms:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/iwms:${{ steps.version.outputs.tag }}
